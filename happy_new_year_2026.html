<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year ✨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0b1d26,#000);
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* CANVAS LAYERS */
#starCanvas{
  position:fixed;
  inset:0;
  z-index:-2;
}

#fireCanvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* soft sky glow */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, #84fab022, transparent 40%),
    radial-gradient(circle at 70% 60%, #8fd3f422, transparent 40%);
  animation:skyDrift 20s ease-in-out infinite alternate;
  z-index:-3;
}
@keyframes skyDrift{
  from{transform:translate(-3%,-2%)}
  to{transform:translate(3%,2%)}
}

/* MESSAGE */
.message{
  position:absolute;
  text-align:center;
  z-index:5;
  pointer-events:none;
}
.message h1{
  font-size:clamp(26px,7vw,44px);
  background:linear-gradient(90deg,#ffd700,#ff9aa2,#84fab0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.message p{
  margin-top:10px;
  font-size:clamp(14px,4vw,16px);
  opacity:.85;
}

.hint{
  position:absolute;
  bottom:40px;
  font-size:14px;
  opacity:.6;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:1}}
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>
<canvas id="fireCanvas"></canvas>

<div class="message">
  <h1>Happy New Year ✨</h1>
  <p>May your year shine like a celebration 🌙</p>
</div>
<div class="hint">Tap anywhere 🎆</div>

<script>
/* ================= STAR SKY (FIXED) ================= */
const starCanvas=document.getElementById("starCanvas");
const sctx=starCanvas.getContext("2d");
let sw,sh;

function resizeStar(){
  sw=starCanvas.width=window.innerWidth;
  sh=starCanvas.height=window.innerHeight;
}
resizeStar();
window.addEventListener("resize",resizeStar);

const stars=[];
for(let i=0;i<140;i++){
  stars.push({
    x:Math.random()*sw,
    y:Math.random()*sh,
    r:Math.random()*1.8+0.4,
    base:Math.random()*1.8+0.4,
    speed:Math.random()*0.03+0.01
  });
}

function drawStars(){
  sctx.clearRect(0,0,sw,sh);
  stars.forEach(st=>{
    st.r = st.base + Math.sin(Date.now()*st.speed)*0.4;
    sctx.fillStyle="white";
    sctx.beginPath();
    sctx.arc(st.x,st.y,st.r,0,Math.PI*2);
    sctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ================= FIREWORKS ================= */
const fireCanvas=document.getElementById("fireCanvas");
const fctx=fireCanvas.getContext("2d");
let fw,fh;

function resizeFire(){
  fw=fireCanvas.width=window.innerWidth;
  fh=fireCanvas.height=window.innerHeight;
}
resizeFire();
window.addEventListener("resize",resizeFire);

const particles=[];

function randColor(){
  const c=["#ffd700","#ff4d6d","#84fab0","#8fd3f4","#ff9f1c"];
  return c[Math.floor(Math.random()*c.length)];
}

function firework(x,y){
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*5+2;
    particles.push({
      x,y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      life:90,
      color:randColor()
    });
  }
}

function animateFire(){
  fctx.clearRect(0,0,fw,fh);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.03;
    p.life--;

    fctx.fillStyle=p.color;
    fctx.beginPath();
    fctx.arc(p.x,p.y,2,0,Math.PI*2);
    fctx.fill();

    if(p.life<=0) particles.splice(i,1);
  }
  requestAnimationFrame(animateFire);
}
animateFire();

/* CLICK = WEDDING FIREWORK */
document.body.addEventListener("click",(e)=>{
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      firework(
        e.clientX + (Math.random()-0.5)*80,
        e.clientY + (Math.random()-0.5)*80
      );
    },i*180);
  }
});
</script>

</body>
</html>
