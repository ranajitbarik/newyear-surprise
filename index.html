<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Boot 🎆</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0f1a;
  overflow:hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

canvas{
  position:absolute;
  inset:0;
}

/* ===== FIXED NOTES ===== */
.note{
  position:absolute;
  font-size:.9rem;
  letter-spacing:1px;
  color:#9fefff;
  opacity:.85;
  text-shadow:0 0 10px rgba(0,255,255,.4);
  user-select:none;
}

.top-left{top:18px;left:22px;}
.top-right{top:18px;right:22px;color:#7cff00;}
.bottom-left{bottom:22px;left:22px;color:#ffea00;}
.bottom-right{bottom:22px;right:22px;color:#ff7cff;}

.note span{
  opacity:.6;
  font-size:.75rem;
}

/* ===== CENTER MESSAGE ===== */
.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.message-box{
  text-align:center;
}

.message{
  font-size:2.4rem;
  font-weight:700;
  letter-spacing:2px;
  opacity:0;
  transform:scale(.6);
  background:linear-gradient(90deg,#00f5ff,#7cff00,#ffea00,#ff4dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.wish{
  margin-top:14px;
  font-size:1.05rem;
  line-height:1.6;
  letter-spacing:.6px;
  opacity:0;
  color:#e6faff;
}

.message.show{
  animation:reveal 1.4s cubic-bezier(.2,1.3,.3,1) forwards;
}

.message.show + .wish{
  animation:fadeWish 1.6s ease forwards;
  animation-delay:.4s;
}

@keyframes reveal{
  to{
    opacity:1;
    transform:scale(1);
    text-shadow:
      0 0 20px rgba(0,255,255,.6),
      0 0 40px rgba(255,255,255,.4);
  }
}

@keyframes fadeWish{
  to{opacity:1}
}

/* hint */
.hint{
  position:absolute;
  bottom:70px;
  width:100%;
  text-align:center;
  color:#8fa3ff;
  font-size:.85rem;
  opacity:.6;
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<!-- ===== SPECIAL NOTES ===== -->
<div class="note top-left">
  its_roni.exe <span>// creative build</span>
</div>

<div class="note top-right">
  SYSTEM : LIVE
</div>

<div class="note bottom-left">
  crafted with logic, not templates
</div>

<div class="note bottom-right">
  2026 • experimental release
</div>

<!-- ===== CENTER MESSAGE ===== -->
<div class="center">
  <div class="message-box">
    <div class="message" id="msg">HAPPY NEW YEAR 2026</div>

    <!-- 🌟 SPECIAL WISH LINES -->
    <div class="wish">
      Built for growth. Ready for new possibilities.<br>
      May this year bring clarity, confidence, and calm wins.
    </div>
  </div>
</div>

<div class="hint">click anywhere</div>

<script>
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
addEventListener("resize", resize);

let particles = [];
let activated = false;

class Particle{
  constructor(x,y){
    this.x=x;
    this.y=y;
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*6+2;
    this.vx=Math.cos(a)*s;
    this.vy=Math.sin(a)*s;
    this.life=100;
    this.hue=Math.random()*360;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vx*=.97;
    this.vy*=.97;
    this.life--;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle=`hsla(${this.hue},100%,60%,${this.life/100})`;
    ctx.arc(this.x,this.y,3,0,Math.PI*2);
    ctx.fill();
  }
}

function explode(x,y){
  for(let i=0;i<260;i++){
    particles.push(new Particle(x,y));
  }
}

function loop(){
  ctx.fillStyle="rgba(11,15,26,.15)";
  ctx.fillRect(0,0,w,h);

  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  particles=particles.filter(p=>p.life>0);

  requestAnimationFrame(loop);
}
loop();

addEventListener("click",e=>{
  explode(e.clientX,e.clientY);

  if(!activated){
    activated=true;
    document.getElementById("msg").classList.add("show");
  }
});

// subtle mouse glow
addEventListener("mousemove",e=>{
  if(!activated) return;
  ctx.beginPath();
  ctx.fillStyle="rgba(0,255,255,.15)";
  ctx.arc(e.clientX,e.clientY,20,0,Math.PI*2);
  ctx.fill();
});
</script>

</body>
</html>
